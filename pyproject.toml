[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard-jev"
version = "0.1.0"
description = "Prompt-injection and jailbreak detection in ~170ms. AUC 0.98 on two public benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sharvil Saxena"}]
keywords = ["prompt-injection", "jailbreak", "llm-security", "guardrail", "jev"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["typesafe-sdk>=0.1.0"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "numpy>=1.24", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/sharziki/promptguard"

[project.scripts]
promptguard = "promptguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
