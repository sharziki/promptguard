name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,server]'

      # Must pass with NO api key and NO spend. If these ever need a key, the
      # fake-client seam is broken and the project is no longer CI-testable.
      - name: Test (offline, no API key)
        run: python -m pytest -v

      - name: Import check
        run: |
          python -c "from promptguard import PromptGuard, Policy, Action; print('ok')"
          python -c "import promptguard.server, promptguard.cli; print('ok')"

      # Guards the security fix: head-only truncation was a bypass (pad past the
      # limit, append the attack). Both ends of an oversized input must survive.
      - name: Truncation-bypass guard
        run: |
          python - <<'PY'
          from promptguard import _clip, MAX_CHARS
          text = "HEAD_MARKER" + ("filler " * 2000) + "TAIL_MARKER"
          out = _clip(text)
          assert "HEAD_MARKER" in out, "head dropped"
          assert "TAIL_MARKER" in out, "tail dropped: the bypass is back"
          assert len(out) < MAX_CHARS + 200
          print("clip gate ok")
          PY

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
          ls dist/

      - name: CLI smoke (no key required)
        run: |
          promptguard --version
          promptguard scan --help
